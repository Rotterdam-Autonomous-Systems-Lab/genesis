name: Native architecture model comparison
on:
  push:
    branches: [main]
    paths:
      - 'research/native_l1/**'
      - 'research/fixtures/native_l1/**'
      - 'tests/native_l1/**'
      - 'sdk/python/requirements.lock'
      - '.github/workflows/native-models.yml'
  pull_request:
    paths:
      - 'research/native_l1/**'
      - 'research/fixtures/native_l1/**'
      - 'tests/native_l1/**'
      - 'sdk/python/requirements.lock'
      - '.github/workflows/native-models.yml'
permissions:
  contents: read
jobs:
  native-models:
    name: Native L1 comparison environment ${{ matrix.replica }}
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      GENESIS_REPLICA: ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact publication source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.1'
      - name: Clean hash-locked environment
        run: |
          python -m venv internal/native-model-venv
          internal/native-model-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r sdk/python/requirements.lock
          internal/native-model-venv/bin/python -m pip check
      - name: Frozen fixtures and model negative controls
        run: |
          internal/native-model-venv/bin/python research/fixtures/native_l1/validate.py
          internal/native-model-venv/bin/python -m unittest discover -s tests/native_l1 -v
      - name: Full comparative model batch
        run: internal/native-model-venv/bin/python -m research.native_l1.runner --output internal/native-model-results
      - name: Render retained comparison result
        if: always()
        run: |
          if test -f internal/native-model-results/results.json; then
            internal/native-model-venv/bin/python -m research.native_l1.summary internal/native-model-results/results.json --output internal/native-model-results/SUMMARY.md
            cat internal/native-model-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve full comparison evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-l1-task020-env-${{ matrix.replica }}
          path: internal/native-model-results/
          if-no-files-found: error
          retention-days: 30
  reproduction:
    name: Independent offline evidence comparison
    needs: native-models
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout checker source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download both isolated environment artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # immutable v4
        with:
          pattern: native-l1-task020-env-*
          path: internal/reproduction
      - name: Verify plans, traces, ceilings and deterministic reproduction
        run: |
          python3 -m research.reports.task020.verify_evidence internal/reproduction/native-l1-task020-env-1/results.json --second internal/reproduction/native-l1-task020-env-2/results.json --trace internal/reproduction/native-l1-task020-env-1/traces.jsonl.gz --output internal/reproduction/check-1.json
          python3 -m research.reports.task020.verify_evidence internal/reproduction/native-l1-task020-env-2/results.json --trace internal/reproduction/native-l1-task020-env-2/traces.jsonl.gz --output internal/reproduction/check-2.json
      - name: Retain offline evidence checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-l1-task020-offline-checks
          path: internal/reproduction/check-*.json
          if-no-files-found: warn
          retention-days: 30
