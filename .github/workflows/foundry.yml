name: Local Experiments 001 and 002
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  escrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # immutable v1 reference
        with:
          version: v1.0.0
          cache: false
      - name: Verify toolchain and install checksum-pinned compiler
        run: |
          scripts/check-toolchain.sh
          scripts/check-dependencies.sh
          scripts/bootstrap-solc.sh
      - name: Check formatting
        run: forge fmt --check
      - name: Build without compiler downloads
        run: forge build --offline
      - name: Unit, fuzz and stateful invariant tests
        run: forge test --offline -v
      - name: Local Anvil smoke check (no transactions)
        run: scripts/check-anvil.sh
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.1'
      - name: Install hash-locked Python dependencies
        run: |
          python -m venv internal/agent-venv
          internal/agent-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r sdk/python/requirements.lock
          internal/agent-venv/bin/python -m pip check
      - name: Python unit and local Anvil integration tests
        env:
          PYTHONPATH: sdk/python
        run: internal/agent-venv/bin/python -m unittest discover -s tests/python -v
      - name: Pinned-Anvil fee discrepancy characterization (not Experiment 002 acceptance)
        run: internal/agent-venv/bin/python -m unittest discover -s research/compatibility/experiment002 -p 'test_fee_*.py' -v
      - name: End-to-end independent-agent experiment (loopback synthetic funds only)
        run: scripts/run-experiment-001.sh
      - name: Preserve pinned control binaries for signature comparison
        run: |
          mkdir -p internal/tools/foundry internal/task011
          cp "$(command -v anvil)" internal/tools/foundry/anvil
          cp "$(command -v cast)" internal/tools/foundry/cast
          internal/agent-venv/bin/python research/compatibility/experiment002/check_vectors.py
          internal/agent-venv/bin/python research/compatibility/experiment002/check_fee_bounds.py
      - name: Install isolated checksum/source-pinned corrected Anvil
        run: internal/agent-venv/bin/python research/compatibility/experiment002/install_anvil_candidate.py
      - name: Corrected-node integrity and identical strict fee tests
        run: internal/agent-venv/bin/python -m unittest discover -s research/compatibility/experiment002 -p 'test_candidate_*.py' -v
      - name: Corrected-node signatures and old/new fee evidence
        run: |
          internal/agent-venv/bin/python research/compatibility/experiment002/check_vectors.py --candidate
          internal/agent-venv/bin/python research/compatibility/experiment002/compare_anvil_baselines.py > internal/task011/ci-fee-comparison.json
      - name: Unchanged Experiment 001 controls on verified corrected node
        run: internal/agent-venv/bin/python research/compatibility/experiment002/candidate_regressions.py > internal/task011/ci-candidate-regressions.json
      - name: Experiment 002 independent agents and adversarial integration
        env:
          PYTHONPATH: sdk/python
        run: internal/agent-venv/bin/python -m unittest discover -s tests/experiment002 -v
      - name: Experiment 002 standalone canonical settlement
        run: scripts/run-experiment-002.sh
