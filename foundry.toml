[profile.default]
src = "contracts/src"
test = "contracts/test"
libs = ["lib"]
out = "out"
cache_path = "cache"
solc = "internal/tools/solc"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = []
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 256
seed = "0x003a"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
